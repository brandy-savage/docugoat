name: Deploy web app to GitHub Pages

on:
  push:
    branches: [deploy/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (editor round-trip + PDF)
        run: npm run test:editor --workspace web && npm run test:pdf --workspace web
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
        run: npm run build --workspace web && cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
